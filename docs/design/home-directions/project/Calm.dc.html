<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calm: home screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; background: {{c.bg}}; color: {{c.ink}}; overflow: hidden">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 54px 16px 12px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 500; color: {{c.soft}}">Wednesday, 25 November</span>
        <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">Today</h1>
      </div>
      <button aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: {{c.surface}}; color: {{c.soft}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 22px; background: {{c.surface}}">
      <span style="align-self: flex-start; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{c.chip}}; color: {{c.chipInk}}">Day 3 of 5 · Muscle building</span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Legs &amp; Abs</span>
        <span style="font-size: 15px; color: {{c.soft}}">7 exercises · about 60 min</span>
      </div>
      <button style="height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; background: {{c.accent}}; color: {{c.onAccent}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
        Start workout
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; padding: 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">This week</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <button style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 18px; background: {{c.surface}}">
          <span style="font-size: 26px; font-weight: 700">5</span>
          <span style="font-size: 13px; color: {{c.soft}}">new PRs</span>
        </button>
        <button style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 18px; background: {{c.surface}}">
          <span style="font-size: 26px; font-weight: 700">3</span>
          <span style="font-size: 13px; color: {{c.soft}}">workouts</span>
        </button>
        <button style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 18px; background: {{c.surface}}">
          <span style="font-size: 26px; font-weight: 700">184</span>
          <span style="font-size: 13px; color: {{c.soft}}">minutes</span>
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; padding: 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Body &amp; habits</h2>
      <div style="display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: {{c.surface}}">
        <button style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px">
          <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 500">Bodyweight</span><span style="font-size: 13px; color: {{c.soft}}">−0.4 lb this week</span></span>
          <span style="font-size: 17px; font-weight: 600">186.2 lb</span>
          <span style="width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{c.chip}}; color: {{c.chipInk}}" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
        </button>
        <button style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px; border-top: 1px solid {{c.line}}">
          <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 500">Week streak</span><span style="font-size: 13px; color: {{c.soft}}">weeks in a row with a workout</span></span>
          <span style="font-size: 17px; font-weight: 600">6</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: {{c.soft}}" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
        <button style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px; border-top: 1px solid {{c.line}}">
          <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 500">Weekly volume</span><span style="font-size: 13px; color: {{c.good}}">+8% on last week</span></span>
          <span style="font-size: 17px; font-weight: 600">42,350 lb</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: {{c.soft}}" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
        <button style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px; border-top: 1px solid {{c.line}}">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 16px; font-weight: 500">Plan adherence</span>
            <span style="display: block; height: 6px; width: 150px; border-radius: 3px; background: {{c.track}}"><span style="display: block; height: 6px; width: 60%; border-radius: 3px; background: {{c.accent}}"></span></span>
          </span>
          <span style="font-size: 17px; font-weight: 600">3 of 5</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: {{c.soft}}" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 28px; background: {{c.bar}}; border-top: 1px solid {{c.line}}">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.accentText}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 500; color: {{c.soft}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>Calendar</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 500; color: {{c.soft}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"></rect></svg>Library</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 500; color: {{c.soft}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"></path><path d="M15 8h5v5"></path></svg>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
const light = { bg: '#F2F4F7', surface: '#FFFFFF', bar: '#F8F9FB', ink: '#101828', soft: '#5D6676', line: '#E4E7EC', chip: '#E8EEFD', chipInk: '#2346C0', accent: '#2F5BEA', onAccent: '#FFFFFF', accentText: '#2F5BEA', good: '#12715B', track: '#E4E7EC' };
const night = { bg: '#0B0D12', surface: '#161A22', bar: '#10131A', ink: '#EEF1F6', soft: '#9AA3B2', line: '#252B36', chip: '#1F2A4A', chipInk: '#A9BEFF', accent: '#7C9CFF', onAccent: '#0B0D12', accentText: '#8EAAFF', good: '#5FD3B0', track: '#2A303C' };
return { c: dark ? night : light };
}
}
</script>
</body>
</html>
